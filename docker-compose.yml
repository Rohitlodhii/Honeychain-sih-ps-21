services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: honeychain-postgres
    environment:
      POSTGRES_USER: honeychain
      POSTGRES_PASSWORD: honeychain_dev
      POSTGRES_DB: honeychain
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honeychain -d honeychain"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - honeychain

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://honeychain:honeychain_dev@postgres:5432/honeychain
      - SECRET_KEY=dev-secret-key-change-in-production
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8000
      - FRONTEND_URL=http://localhost:3000
      - API_PORT=8000
      # Development-only credential for local admin-dashboard verification.
      - ADMIN_INVITE_CODE=local-demo-admin-invite
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - honeychain

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - honeychain
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  honeychain:
    driver: bridge
