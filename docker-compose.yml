version: '3.8'

services:
  # PostgreSQL Database (optional - for production)
  # postgres:
  #   image: postgres:15-alpine
  #   environment:
  #     POSTGRES_USER: honeychain
  #     POSTGRES_PASSWORD: honeychain_dev
  #     POSTGRES_DB: honeychain
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./honey.db
      - SECRET_KEY=dev-secret-key-change-in-production
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8000
      - FRONTEND_URL=http://localhost:3000
      - API_PORT=8000
    volumes:
      - ./backend:/app
      - ./backend/honey.db:/app/honey.db
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - honeychain

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - honeychain
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  honeychain:
    driver: bridge
